<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogChat - 業務連絡</title>
    <style>
        :root { --main-blue: #0078d4; --bg-gray: #f3f2f1; }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg-gray); overflow: hidden; height: 100%; }
        
        /* チャットUI */
        #chat-app { display: flex; flex-direction: column; height: 100vh; transition: background 3s; }
        header { background: var(--main-blue); color: white; padding: 15px; font-weight: bold; transition: background 2s; }
        #message-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { background: white; padding: 10px; border-radius: 8px; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; animation: fadeIn 0.3s; }
        .msg.bot { align-self: flex-start; }
        .user-name { font-size: 0.7em; color: #666; margin-bottom: 4px; }
        
        /* 侵食エフェクト */
        .white-finger-bg { background-image: url('https://www.transparenttextures.com/patterns/crackle.png') !important; }
        .glitch { animation: glitch 0.1s infinite; }
        @keyframes glitch { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(0); } }

        /* 赤い部屋のダイアログ */
        #horror-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(139, 0, 0, 0.9); z-index: 1000; color: white; 
            justify-content: center; align-items: center; flex-direction: column; text-align: center;
        }
        #modal { background: white; color: black; padding: 30px; border-radius: 10px; border: 4px solid #8b0000; max-width: 80%; }
        #modal button { margin-top: 20px; padding: 10px 20px; background: #8b0000; color: white; border: none; cursor: pointer; }

        /* 最終画面 */
        #final-screen { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; z-index: 2000; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="chat-app">
    <header id="header">LogChat [プロジェクト・α]</header>
    <div id="message-area">
        <div class="msg bot">
            <div class="user-name">田中 太郎</div>
            <div>本日の進捗、共有します。</div>
        </div>
        <div class="msg bot" id="trigger-msg" style="cursor: pointer; border: 2px solid var(--main-blue);">
            <div class="user-name">不明なユーザー</div>
            <div style="color: var(--main-blue);">[画像] 指の件、確認お願いします。</div>
        </div>
    </div>
</div>

<div id="horror-overlay">
    <div id="modal">
        <p id="horror-text">あ な た は</p>
        <button onclick="nextHorror()">OK</button>
    </div>
</div>

<div id="final-screen">
    <div style="color: red; font-size: 1.5em; text-align: center;" id="typing-text"></div>
    <div id="finger-img" style="font-size: 100px; margin-top: 20px; filter: grayscale(1) brightness(2);">☝️</div>
</div>

<script>
    let step = 0;
    const messages = [
        "あ な た は", 
        "あ な た は 好き？", 
        "あ な た は 白い指が好きですか？", 
        "あ な た は 赤い通知が 好きですか？"
    ];

    // 起動トリガー
    document.getElementById('trigger-msg').addEventListener('click', function() {
        startInvasion();
    });

    function startInvasion() {
        // UIの変質開始
        document.getElementById('header').style.background = '#8b0000';
        document.body.classList.add('white-finger-bg');
        
        // 偽の通知音（実際の音声ファイルを指定すれば鳴ります）
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        setTimeout(() => {
            document.getElementById('horror-overlay').style.display = 'flex';
        }, 1000);
    }

    function nextHorror() {
        step++;
        if (navigator.vibrate) navigator.vibrate(50);

        if (step < messages.length) {
            document.getElementById('horror-text').innerText = messages[step];
            // 画面を少しずつ赤く、狂わせていく
            document.getElementById('horror-overlay').style.background = `rgba(${139 + step*20}, 0, 0, 0.9)`;
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('horror-overlay').style.display = 'none';
        const final = document.getElementById('final-screen');
        final.style.display = 'flex';
        
        let text = "あなたの指、一本足りないよ。今、もらいに行くね。";
        let i = 0;
        const target = document.getElementById('typing-text');
        
        const timer = setInterval(() => {
            if (i < text.length) {
                target.innerHTML += text.charAt(i);
                i++;
                if (navigator.vibrate) navigator.vibrate(20);
            } else {
                clearInterval(timer);
                // 最後に画面をフラッシュさせて終了
                setTimeout(() => {
                    final.style.background = "white";
                    document.getElementById('finger-img').style.transform = "scale(5)";
                    setTimeout(() => final.style.display = 'none', 100);
                }, 2000);
            }
        }, 150);
    }
</script>
</body>
</html>
