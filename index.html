<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGO Chat - 多々良沼保全課</title>
    <style>
        :root {
            /* ヘッダー色: darkturquoise */
            --header-bg: #00ced1;
            --bg-gray: #f0f2f5;
            --bubble-white: #ffffff;
            /* チャット背景色: paleturquoise */
            --bubble-main: #afeeee; 
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-gray);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* チャットエリア */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sato {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.suzuki {
            align-self: flex-start;
            align-items: flex-start;
        }

        .user-name {
            font-size: 12px;
            color: #65676b;
            margin-bottom: 5px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        /* 佐藤側の色（背景: paleturquoise / 文字: 黒） */
        .sato .bubble {
            background-color: var(--bubble-main);
            color: #000; /* 黒字 */
            border-bottom-right-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 鈴木側の色 */
        .suzuki .bubble {
            background-color: var(--bubble-white);
            color: black;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 画像サムネイル */
        .photo-thumbnail {
            margin-top: 10px;
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid #ddd;
        }

        .photo-thumbnail:hover {
            opacity: 0.9;
        }

        /* モーダル */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modal-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        #close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>LOGO Chat - 多々良沼保全課</header>

<div id="chat-window">
    </div>

<div id="modal" onclick="closeModal()">
    <span id="close-btn">&times;</span>
    <img id="modal-img" src="" alt="拡大写真">
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    
    const chatData = [
        { type: 'sato', name: '佐藤', text: '鈴木さん、お疲れ様です。彫刻の径の定期巡回、今日の分の写真を上げてもらえますか？' },
        { type: 'suzuki', name: '鈴木', text: 'お疲れ様です。了解しました。今日の巡回写真です。特に異常はありませんでした。', img: 'https://picsum.photos/seed/tatara/800/600' },
        { type: 'sato', name: '佐藤', text: '何か白い物が写っていませんか？' },
        { type: 'suzuki', name: '鈴木', text: '写っていませんよ？' }
    ];

    let index = 0;
    // 表示間隔を3.5秒（3500ms）に延長
    const messageDelay = 3500;

    function addMessage() {
        if (index >= chatData.length) return;

        const data = chatData[index];
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${data.type}`;

        let content = `
            <span class="user-name">${data.name}</span>
            <div class="bubble">${data.text}</div>
        `;

        if (data.img) {
            content += `<img src="${data.img}" alt="巡回写真" class="photo-thumbnail" onclick="openModal('${data.img}')">`;
        }

        messageDiv.innerHTML = content;
        chatWindow.appendChild(messageDiv);

        chatWindow.scrollTop = chatWindow.scrollHeight;

        index++;

        if (index < chatData.length) {
            setTimeout(addMessage, messageDelay);
        }
    }

    // 最初のメッセージ開始
    setTimeout(addMessage, 1000);

    function openModal(src) {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('modal-img').src = src;
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") closeModal();
    });
</script>

</body>
</html>
