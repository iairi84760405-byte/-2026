<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGO Chat - 多々良沼保全課</title>
    <style>
        :root {
            --logo-blue: #2c3e50;
            --bg-gray: #f0f2f5;
            --bubble-white: #ffffff;
            --bubble-blue: #007bff;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-gray);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            background-color: var(--logo-blue);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* チャットエリア */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.sato {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.suzuki {
            align-self: flex-start;
            align-items: flex-start;
        }

        .user-name {
            font-size: 12px;
            color: #65676b;
            margin-bottom: 5px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .sato .bubble {
            background-color: var(--bubble-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .suzuki .bubble {
            background-color: var(--bubble-white);
            color: black;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 画像サムネイル */
        .photo-thumbnail {
            margin-top: 10px;
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid #ddd;
        }

        .photo-thumbnail:hover {
            opacity: 0.9;
        }

        /* モーダル（拡大表示） */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modal-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        #close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

<header>LOGO Chat - 多々良沼保全課</header>

<div id="chat-window">
    <div class="message sato">
        <span class="user-name">佐藤</span>
        <div class="bubble">鈴木さん、お疲れ様です。彫刻の径の定期巡回、今日の分の写真を上げてもらえますか？</div>
    </div>

    <div class="message suzuki">
        <span class="user-name">鈴木</span>
        <div class="bubble">お疲れ様です。了解しました。今日の巡回写真です。特に異常はありませんでした。</div>
        <img src="https://picsum.photos/seed/tatara/800/600" alt="巡回写真" class="photo-thumbnail" onclick="openModal(this.src)">
    </div>
</div>

<div id="modal" onclick="closeModal()">
    <span id="close-btn">&times;</span>
    <img id="modal-img" src="" alt="拡大写真">
</div>

<script>
    function openModal(src) {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('modal-img').src = src;
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // Escキーでも閉じられるように設定
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    });
</script>

</body>
</html>
