<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呪いの沼 - 多々良沼保全記録</title>
    <style>
        :root {
            --paper-bg: #f9f7f1;
            --text-color: #2c3e50;
            --accent-color: #00ced1;
            --horror-red: #b30000;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a1a;
            font-family: "Sawarabi Mincho", "Hiragino Mincho ProN", serif;
            overflow: hidden;
            color: var(--text-color);
        }

        /* ページ全体のコンテナ */
        #book-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            margin: 5vh auto;
            perspective: 1500px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px;
            box-sizing: border-box;
            display: none;
            overflow-y: auto;
            border-left: 2px solid rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-origin: left center;
        }

        .page.active {
            display: block;
            z-index: 10;
        }

        /* めくられた後のスタイル */
        .page.flipped {
            display: block;
            transform: rotateY(-180deg);
            z-index: 1;
            pointer-events: none;
        }

        /* タップエリア（左側） */
        #tap-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 150px;
            height: 100%;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right, rgba(0,0,0,0.2), transparent);
            transition: 0.3s;
        }

        #tap-area:hover {
            background: linear-gradient(to right, rgba(0,0,0,0.4), transparent);
        }

        .tap-guide {
            color: white;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 14px;
            letter-spacing: 5px;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(0); opacity: 0.5; }
            50% { transform: translateX(10px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0.5; }
        }

        h2 {
            text-align: center;
            border-bottom: 2px solid var(--horror-red);
            padding-bottom: 10px;
            color: var(--horror-red);
        }

        p {
            line-height: 1.8;
            margin-bottom: 1.5em;
            font-size: 17px;
            text-align: justify;
        }

        .page-number {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 12px;
            color: #888;
        }

        /* 進行度バー */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 5px;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s;
            z-index: 2000;
        }

        @media (max-width: 600px) {
            .page { padding: 25px; }
            #tap-area { width: 80px; }
            p { font-size: 15px; }
        }
    </style>
</head>
<body>

<div id="tap-area" onclick="nextPage()">
    <div class="tap-guide">◀ 次のページへ</div>
</div>

<div id="progress-bar"></div>

<div id="book-container">
    <div class="page active" id="p1">
        <h2>呪いの沼</h2>
        <p>「よし、これくらいかな。結構きれいになっただろ。」</p>
        <p>手にしていた雑巾をバケツに放り込み、青柳は一息ついた。1月も半ばだが、日が当たるところで作業していたため、身体が暖かくなっていた。</p>
        <p>隣で作業していた佐野が汗をぬぐいつつ、近づいてきた。2人はとある市役所で働いている芸術振興係の職員だ。彫像の小路の清掃のため、市内にある高良地区の林に来ていた。林自体は緑化保全課の管轄だが、市に関わりのある作家などが制作した彫像は芸術振興係の管轄となっている。</p>
        <div class="page-number">1 / 11</div>
    </div>

    <div class="page" id="p2">
        <p>「それじゃあ、報告用に写真撮ります
