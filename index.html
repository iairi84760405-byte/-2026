<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoGoチャット</title>
    <style>
        :root { --logo-teal: #009cb8; --horror-red: #8b0000; }
        body, html { margin: 0; padding: 0; font-family: "Helvetica Neue", Arial, sans-serif; background: #f0f0f0; height: 100%; overflow: hidden; }

        /* LoGoチャット再現UI */
        #ui-wrapper { position: relative; width: 100%; height: 100vh; background: #fff; display: flex; flex-direction: column; transition: filter 2s; }
        header { background: var(--logo-teal); color: white; padding: 10px 15px; font-size: 18px; font-weight: bold; text-align: center; }
        
        /* 実際のチャット画面風エリア */
        #chat-screen { flex: 1; background-image: url('https://i.imgur.com/your-mockup-here.png'); /* 画像の代わりにCSSで再現 */ background-color: #fff; position: relative; }
        .chat-content { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px; border-radius: 10px; font-size: 14px; max-width: 75%; position: relative; }
        .received { background: #eee; align-self: flex-start; }
        .sent { background: var(--logo-teal); color: white; align-self: flex-end; }

        /* 偽広告：これがトリガー */
        #ad-trigger {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 90%; background: #fff; border: 1px solid #ddd; border-radius: 8px;
            display: flex; align-items: center; padding: 10px; cursor: pointer; z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ad-icon { width: 40px; height: 40px; background: #f9f9f9; border: 1px dashed #bbb; margin-right: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .ad-text { font-size: 12px; line-height: 1.4; color: #333; }

        /* 通知・ダイアログ系（JSで制御） */
        #notice-bar {
            position: fixed; top: -100px; left: 10px; right: 10px; background: rgba(255,255,255,0.95);
            padding: 15px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000; transition: 0.5s; border-left: 6px solid var(--logo-teal);
        }
